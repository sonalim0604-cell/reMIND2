<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#4f8fd1">
  <title>reMIND | Profile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <script defer src="/js/shared.js"></script>
  <script defer src="/js/profile.js"></script>
</head>
<body>
  <header class="site-header" data-app-header></header>
  <main class="page-shell app-shell">
    <nav class="screen-nav" aria-label="Page navigation"><a href="/home.html">Home</a></nav>
    <h1>Your profile</h1>
    <p class="lead">Registration details for the person and their care contact.</p>
    <section class="app-section" aria-labelledby="patient-heading">
      <div class="section-heading"><h2 id="patient-heading">Patient details</h2></div>
      <dl class="readonly-grid" id="patient-profile"></dl>
    </section>
    <section class="app-section" aria-labelledby="address-heading">
      <div class="section-heading"><h2 id="address-heading">Address</h2></div>
      <dl class="readonly-grid" id="address-profile"></dl>
    </section>
    <section class="app-section" aria-labelledby="caretaker-heading">
      <div class="section-heading"><h2 id="caretaker-heading">Caretaker or family contact</h2></div>
      <dl class="readonly-grid" id="caretaker-profile"></dl>
    </section>
    <section class="app-section" id="audio-profile-section" aria-labelledby="audio-profile-heading" hidden>
      <div class="section-heading"><h2 id="audio-profile-heading">Audio preference</h2></div>
      <dl class="readonly-grid" id="audio-profile"></dl>
    </section>
  </main>
  <div class="toast-region" id="toast-region" role="status" aria-live="polite"></div>
</body>
</html>
